version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/jss-whatsapp
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./baileys_auth_info:/app/baileys_auth_info
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
volumes:
  mongodb_data: